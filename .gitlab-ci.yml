include:
  - project: "ha-platform/control"
    ref: main
    file: "/ci/hacs-github-release.gitlab-ci.yml"

stages:
  - test
  - release

variables:
  HACS_GITHUB_REPOSITORY: "Levtos/benni-core-contracts"
  HACS_MANIFEST_PATH: "custom_components/benni_core_contracts/manifest.json"

shadow_boundary_tests:
  stage: test
  image: python:3.12-slim
  tags:
    - core-contracts-ci
  timeout: 15 minutes
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - runner_configuration_error
      - runner_external_dependency_failure
      - runner_interrupted
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
      - server_timeout_running
      - server_timeout_canceling
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git
  script:
    - python -m unittest discover -s tests -p "test_*.py"
    - python -m compileall -q custom_components tests
    - python scripts/validate_repository.py
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        git diff --check "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA"
      elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] &&
           [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        git diff --check "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA"
      else
        git diff --check "$CI_COMMIT_SHA^" "$CI_COMMIT_SHA"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

frontend_tests:
  stage: test
  image: node:22-slim
  tags:
    - core-contracts-ci
  timeout: 15 minutes
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - runner_configuration_error
      - runner_external_dependency_failure
      - runner_interrupted
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
      - server_timeout_running
      - server_timeout_canceling
  script:
    - cd frontend
    - npm ci
    - npm run check
    - npm test
    - npm run build
    - cd ..
    - git diff --check
    - git diff --exit-code -- custom_components/benni_core_contracts/frontend/app
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

hacs_github_release:
  tags:
    - core-contracts-ci
  timeout: 15 minutes
  retry:
    max: 1
    when:
      - runner_system_failure
      - runner_configuration_error
      - runner_external_dependency_failure
      - runner_interrupted
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
      - server_timeout_running
      - server_timeout_canceling
