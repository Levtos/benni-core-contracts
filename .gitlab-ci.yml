include:
  - project: "ha-platform/control"
    ref: main
    file: "/ci/hacs-github-release.gitlab-ci.yml"

stages:
  - test
  - release

variables:
  HACS_GITHUB_REPOSITORY: "Levtos/benni-core-contracts"
  HACS_MANIFEST_PATH: "custom_components/benni_core_contracts/manifest.json"

shadow_boundary_tests:
  stage: test
  image: python:3.12-slim
  tags:
    - core-contracts-ci
  timeout: 15 minutes
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - python -m unittest discover -s tests -p "test_*.py"
    - python -m compileall -q custom_components tests
    - python scripts/validate_repository.py
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        git diff --check "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA"
      elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] &&
           [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        git diff --check "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA"
      else
        git diff --check "$CI_COMMIT_SHA^" "$CI_COMMIT_SHA"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

hacs_github_release:
  tags:
    - core-contracts-ci
  timeout: 15 minutes
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
