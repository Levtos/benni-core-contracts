name: Tests

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  shadow-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contracts_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: contracts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contracts_test -d contracts_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CORE_CONTRACTS_TEST_DSN: postgresql://contracts_test:disposable_test_only@localhost:5432/contracts_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install pytest asyncpg==0.31.0 cryptography

      - name: Run registry, exchange and historical boundary tests
        run: |
          python -m pytest -q
          python -m unittest discover -s tests -p "test_*.py"
          python -m compileall -q custom_components tests scripts
          python scripts/validate_repository.py
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend release gate
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          git diff --exit-code -- ../custom_components/benni_core_contracts/frontend
